---
- name: Set up Arch
  hosts: all
  gather_facts: true

  vars:
    fish_dir: "{{ lookup('env', 'HOME') }}/.config/fish"
    fish_links:
      - config.fish
      - functions/fish_greeting.fish
    packages:
      # KDE
      - plasma-meta
      - plasma-login-manager
      - konsole
      - ghostty
      - dolphin
      # shell + cli
      - fish
      - eza
      - fzf
      - btop
      - zoxide
      - fastfetch
      - micro
      - ncdu
      - nano
      - vim
      - mpv
      # apps
      - handbrake
      - gimp
      - krita
      - steam
      - mumble
      - feishin
      - signal-desktop
      # build deps for paru
      - base-devel
      - git
      - rust
      - dkms
      - linux-headers

    surface_packages:
      - linux-surface
      - linux-surface-headers
      - iptsd

    aur_packages:
      - brave-bin
      - visual-studio-code-bin
      - discord
      - github-copilot-cli
      - herdr-bin
      - r2modman-bin
      - bazecor
      - ventoy-bin
      - xpad-noone-git

  tasks:
    - name: Detect Surface hardware
      ansible.builtin.set_fact:
        is_surface: "{{ 'Surface' in ansible_product_name | default('') }}"

    - name: Set up the linux-surface repository
      when: is_surface
      block:
        - name: Import the linux-surface signing key
          become: true
          ansible.builtin.shell:
            cmd: >-
              curl -fsSL https://raw.githubusercontent.com/linux-surface/linux-surface/master/pkg/keys/surface.asc
              | pacman-key --add - && pacman-key --lsign-key 56C464BAAC421453
          changed_when: false

        - name: Remove any unmanaged linux-surface repository entry
          become: true
          ansible.builtin.replace:
            path: /etc/pacman.conf
            regexp: '(?<!# BEGIN ANSIBLE linux-surface\n)^\[linux-surface\]\n(?:(?:SigLevel|Server|Include)[^\n]*\n)*'
            replace: ''

        - name: Add the linux-surface repository
          become: true
          ansible.builtin.blockinfile:
            path: /etc/pacman.conf
            marker: "# {mark} ANSIBLE linux-surface"
            block: |
              [linux-surface]
              Server = https://pkg.surfacelinux.com/arch/
          register: surface_repo

    - name: Enable the multilib repository
      become: true
      ansible.builtin.replace:
        path: /etc/pacman.conf
        regexp: '^#\[multilib\]\n#Include = (.*)$'
        replace: '[multilib]\nInclude = \1'
      register: multilib

    - name: Refresh the package databases
      become: true
      ansible.builtin.command: pacman -Sy
      when: multilib.changed or surface_repo.changed | default(false)
      changed_when: false

    - name: Install packages
      become: true
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present

    - name: Install the Surface kernel
      become: true
      ansible.builtin.package:
        name: "{{ surface_packages }}"
        state: present
      when: is_surface

    - name: Check the current display manager
      ansible.builtin.stat:
        path: /etc/systemd/system/display-manager.service
      register: dm

    - name: Disable SDDM
      become: true
      ansible.builtin.systemd_service:
        name: sddm
        enabled: false
      when: "'sddm' in dm.stat.lnk_target | default('')"

    - name: Make plasma-login-manager the display manager
      become: true
      ansible.builtin.command: systemctl enable --force plasmalogin.service
      when: "'plasmalogin' not in dm.stat.lnk_target | default('')"
      changed_when: true

    - name: Set fish as the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id | default(lookup('env', 'USER')) }}"
        shell: /usr/bin/fish

    - name: Create the fish config directories
      ansible.builtin.file:
        path: "{{ fish_dir }}/{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ fish_links }}"

    - name: Link the fish config from the repo
      ansible.builtin.file:
        src: "{{ playbook_dir }}/fish/{{ item }}"
        dest: "{{ fish_dir }}/{{ item }}"
        state: link
        force: true
      loop: "{{ fish_links }}"

    - name: Check for paru
      ansible.builtin.stat:
        path: /usr/bin/paru
      register: paru

    - name: Build and install paru
      when: not paru.stat.exists
      block:
        - name: Clone paru
          ansible.builtin.git:
            repo: https://aur.archlinux.org/paru.git
            dest: /tmp/paru
            depth: 1
            version: master

        - name: Build paru
          ansible.builtin.command:
            cmd: makepkg -sf --noconfirm
            chdir: /tmp/paru
          changed_when: true

        - name: Find the built package
          ansible.builtin.find:
            paths: /tmp/paru
            patterns: "paru-*.pkg.tar.*"
            excludes: "paru-debug-*"
          register: pkg

        - name: Install paru
          become: true
          ansible.builtin.command:
            cmd: pacman -U --noconfirm --needed {{ pkg.files | map(attribute='path') | join(' ') }}
          changed_when: true

      always:
        - name: Remove the paru build directory
          ansible.builtin.file:
            path: /tmp/paru
            state: absent

    - name: List installed packages
      ansible.builtin.command: pacman -Qq
      register: installed
      changed_when: false

    - name: Install AUR packages
      vars:
        missing: "{{ aur_packages | difference(installed.stdout_lines) }}"
      when: missing | length > 0
      block:
        - name: Allow paru to run pacman without a password prompt
          become: true
          ansible.builtin.copy:
            dest: /etc/sudoers.d/99-paru
            mode: "0440"
            validate: visudo -cf %s
            content: "{{ lookup('env', 'USER') }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
          changed_when: false

        - name: Install with paru
          ansible.builtin.command:
            cmd: paru -S --noconfirm --needed --skipreview {{ item }}
          loop: "{{ missing }}"
          changed_when: true

      always:
        - name: Drop the passwordless sudo rule
          become: true
          ansible.builtin.file:
            path: /etc/sudoers.d/99-paru
            state: absent
          changed_when: false
