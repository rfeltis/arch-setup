---
- name: Set up Arch
  hosts: all
  gather_facts: true

  vars:
    fish_dir: "{{ lookup('env', 'HOME') }}/.config/fish"
    fish_links:
      - config.fish
      - functions/fish_greeting.fish
    # Hosts that log in with the SSH key stored on the YubiKey. If the key file is missing (after a reinstall),
    # the playbook asks for the YubiKey's FIDO2 PIN and downloads it from the YubiKey.
    yubikey_ssh_hosts:
      - stryketopia
    yubikey_ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_sk"
    packages:
      # KDE
      - plasma-meta
      - plasma-login-manager
      - konsole
      - ghostty
      - dolphin
      # shell + cli
      - fish
      - eza
      - fzf
      - btop
      - zoxide
      - fastfetch
      - pciutils
      - micro
      - ncdu
      - nano
      - less
      - vim
      - mpv
      - opencode
      # SSH keys on a security key such as a YubiKey
      - libfido2
      # apps
      - handbrake
      - gimp
      - krita
      - steam
      - gamescope
      - mumble
      - feishin
      - signal-desktop
      # build deps for AUR packages
      - base-devel
      - git
      - dkms
      - linux-headers

    surface_packages:
      - linux-surface
      - linux-surface-headers
      - iptsd

    nvidia_packages:
      - nvidia-open-dkms
      - nvidia-utils
      - lib32-nvidia-utils
      - nvidia-settings

    aur_packages:
      - brave-bin
      - visual-studio-code-bin
      - discord
      - github-copilot-cli
      - github-copilot-app-bin
      - herdr-bin
      - r2modman-bin
      - bazecor
      - ventoy-bin
      - xpad-noone-git
      - opencode-desktop-bin

    sunshine_aur_packages:
      - sunshine

    stryketopia_packages:
      - sshfs
      - gocryptfs

  tasks:
    - name: Detect Surface hardware
      ansible.builtin.set_fact:
        is_surface: "{{ 'Surface' in ansible_product_name | default('') }}"

    - name: Set up the linux-surface repository
      when: is_surface
      block:
        - name: Import the linux-surface signing key
          become: true
          ansible.builtin.shell:
            cmd: >-
              curl -fsSL https://raw.githubusercontent.com/linux-surface/linux-surface/master/pkg/keys/surface.asc
              | pacman-key --add - && pacman-key --lsign-key 56C464BAAC421453
          changed_when: false

        - name: Remove any unmanaged linux-surface repository entry
          become: true
          ansible.builtin.replace:
            path: /etc/pacman.conf
            regexp: '(?<!# BEGIN ANSIBLE linux-surface\n)^\[linux-surface\]\n(?:(?:SigLevel|Server|Include)[^\n]*\n)*'
            replace: ''

        - name: Add the linux-surface repository
          become: true
          ansible.builtin.blockinfile:
            path: /etc/pacman.conf
            marker: "# {mark} ANSIBLE linux-surface"
            block: |
              [linux-surface]
              Server = https://pkg.surfacelinux.com/arch/
          register: surface_repo

    - name: Enable the multilib repository
      become: true
      ansible.builtin.replace:
        path: /etc/pacman.conf
        regexp: '^#\[multilib\]\n#Include = (.*)$'
        replace: '[multilib]\nInclude = \1'
      register: multilib

    - name: Refresh the package databases
      become: true
      ansible.builtin.command: pacman -Sy
      when: multilib.changed or surface_repo.changed | default(false)
      changed_when: false

    - name: Install packages
      become: true
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present

    - name: Install stryketopia packages
      become: true
      ansible.builtin.package:
        name: "{{ stryketopia_packages }}"
        state: present
      when: ansible_hostname == 'stryketopia'

    - name: Install the Surface kernel
      become: true
      ansible.builtin.package:
        name: "{{ surface_packages }}"
        state: present
      when: is_surface

    - name: Detect PCI devices
      ansible.builtin.command: lspci -Dn
      register: pci_devices
      changed_when: false
      check_mode: false

    - name: Detect NVIDIA graphics hardware
      ansible.builtin.set_fact:
        has_nvidia_gpu: >-
          {{ pci_devices.stdout is search('(?im)^\S+\s+03[0-9a-f]{2}:\s+10de:') }}

    - name: Install NVIDIA open kernel modules and utilities
      become: true
      ansible.builtin.package:
        name: "{{ nvidia_packages }}"
        state: present
      when: has_nvidia_gpu

    - name: Check the current display manager
      ansible.builtin.stat:
        path: /etc/systemd/system/display-manager.service
      register: dm

    - name: Disable SDDM
      become: true
      ansible.builtin.systemd_service:
        name: sddm
        enabled: false
      when: "'sddm' in dm.stat.lnk_target | default('')"

    - name: Make plasma-login-manager the display manager
      become: true
      ansible.builtin.command: systemctl enable --force plasmalogin.service
      when: "'plasmalogin' not in dm.stat.lnk_target | default('')"
      changed_when: true

    - name: Install the Gamescope session launcher
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/gamescope/gamescope-session"
        dest: /usr/local/bin/gamescope-session
        mode: "0755"

    - name: Add Gamescope to the login manager sessions
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/gamescope/steam-gamescope.desktop"
        dest: /usr/share/wayland-sessions/steam-gamescope.desktop
        mode: "0644"

    - name: Set fish as the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id | default(lookup('env', 'USER')) }}"
        shell: /usr/bin/fish

    - name: Create the fish config directories
      ansible.builtin.file:
        path: "{{ fish_dir }}/{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ fish_links }}"

    - name: Link the fish config from the repo
      ansible.builtin.file:
        src: "{{ playbook_dir }}/fish/{{ item }}"
        dest: "{{ fish_dir }}/{{ item }}"
        state: link
        force: true
      loop: "{{ fish_links }}"

    - name: Check for paru
      ansible.builtin.stat:
        path: /usr/bin/paru
      register: paru

    - name: Install paru-bin
      when: not paru.stat.exists
      block:
        - name: Clone paru-bin
          ansible.builtin.git:
            repo: https://aur.archlinux.org/paru-bin.git
            dest: /tmp/paru-bin
            depth: 1
            version: master

        - name: Package paru-bin
          ansible.builtin.command:
            cmd: makepkg -sf --noconfirm
            chdir: /tmp/paru-bin
          changed_when: true

        - name: Find the built package
          ansible.builtin.find:
            paths: /tmp/paru-bin
            patterns: "paru-bin-*.pkg.tar.*"
            excludes: "paru-bin-debug-*"
          register: pkg

        - name: Install paru-bin
          become: true
          ansible.builtin.command:
            cmd: pacman -U --noconfirm --needed {{ pkg.files | map(attribute='path') | join(' ') }}
          changed_when: true

      always:
        - name: Remove the paru-bin build directory
          ansible.builtin.file:
            path: /tmp/paru-bin
            state: absent

    - name: List installed packages
      ansible.builtin.command: pacman -Qq
      register: installed
      changed_when: false
      check_mode: false

    - name: Install AUR packages
      vars:
        selected_aur_packages: "{{ aur_packages + (sunshine_aur_packages if ansible_hostname == 'livingroom' else []) }}"
        missing: "{{ selected_aur_packages | difference(installed.stdout_lines) }}"
      when: missing | length > 0
      block:
        - name: Allow paru to run pacman without a password prompt
          become: true
          ansible.builtin.copy:
            dest: /etc/sudoers.d/99-paru
            mode: "0440"
            validate: visudo -cf %s
            content: "{{ lookup('env', 'USER') }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
          changed_when: false

        - name: Install with paru
          ansible.builtin.command:
            cmd: paru -S --noconfirm --needed --skipreview {{ item }}
          loop: "{{ missing }}"
          changed_when: true

      always:
        - name: Drop the passwordless sudo rule
          become: true
          ansible.builtin.file:
            path: /etc/sudoers.d/99-paru
            state: absent
          changed_when: false

    # The key on the YubiKey is a resident ed25519-sk key: logging in needs a touch, and the file in ~/.ssh is only
    # a handle that tells the YubiKey which key to use. The YubiKey keeps a copy of the handle, which ssh-keygen -K
    # downloads with the FIDO2 PIN. Each run tries the PIN once. After 3 wrong PINs in a row the YubiKey must be
    # unplugged and plugged back in, and after 8 it locks its FIDO2 part. This runs last, so the prompt doesn't hold
    # up the rest of the setup, and a failed download is reported without stopping the play.
    - name: Restore the YubiKey SSH key
      when: ansible_facts['hostname'] in yubikey_ssh_hosts
      tags: ssh-key
      block:
        - name: Check for the YubiKey SSH key
          ansible.builtin.stat:
            path: "{{ yubikey_ssh_key }}"
          register: yubikey_key_file

        - name: Ask for the YubiKey's PIN
          ansible.builtin.pause:
            prompt: >-
              {{ yubikey_ssh_key }} is missing. To download it from your YubiKey, plug the YubiKey in and enter its
              FIDO2 PIN, then touch the YubiKey if it blinks. Leave the PIN empty to skip
            echo: false
          register: yubikey_pin
          no_log: true
          when: not yubikey_key_file.stat.exists

        - name: Download the SSH key from the YubiKey
          when:
            - not yubikey_key_file.stat.exists
            - yubikey_pin.user_input | default('') | length > 0
          block:
            - name: Create a private working directory
              ansible.builtin.tempfile:
                state: directory
                suffix: .yubikey
              register: yubikey_tmp

            - name: Write a helper that passes the PIN to ssh-keygen
              ansible.builtin.copy:
                dest: "{{ yubikey_tmp.path }}/askpass"
                mode: "0700"
                content: |
                  #!/bin/sh
                  printf '%s\n' "$YUBIKEY_PIN"

            - name: Download the keys stored on the YubiKey
              ansible.builtin.command:
                argv: [ssh-keygen, -K, -N, ""]
                chdir: "{{ yubikey_tmp.path }}"
              environment:
                SSH_ASKPASS: "{{ yubikey_tmp.path }}/askpass"
                SSH_ASKPASS_REQUIRE: force
                YUBIKEY_PIN: "{{ yubikey_pin.user_input }}"
              register: yubikey_download
              changed_when: false
              failed_when: false
              no_log: true

            - name: Stop if the download failed
              ansible.builtin.fail:
                msg: >-
                  ssh-keygen couldn't download the key: {{ yubikey_download.stderr | default('') | trim }}.
                  Check that the YubiKey is plugged in and that the PIN is right, then run ./apply.sh --tags ssh-key.
                  After 3 wrong PINs in a row, unplug the YubiKey and plug it back in. After 8 it locks its FIDO2
                  part, so don't guess.
              when: yubikey_download.rc | default(1) != 0

            - name: Find the downloaded key
              ansible.builtin.find:
                paths: "{{ yubikey_tmp.path }}"
                patterns: "id_ed25519_sk_rk*"
                excludes: "*.pub"
              register: yubikey_found

            - name: Stop if the YubiKey has no SSH key
              ansible.builtin.fail:
                msg: >-
                  The YubiKey has no ed25519-sk SSH key on it. Create one with
                  ssh-keygen -t ed25519-sk -O resident -C yubikey -f {{ yubikey_ssh_key }}
                  and add {{ yubikey_ssh_key }}.pub to authorized_keys on the servers.
              when: yubikey_found.files | length == 0

            - name: Stop if the YubiKey has more than one SSH key
              ansible.builtin.fail:
                msg: >-
                  The YubiKey has {{ yubikey_found.files | length }} ed25519-sk SSH keys
                  ({{ yubikey_found.files | map(attribute='path') | map('basename') | join(', ') }}).
                  Run ssh-keygen -K yourself and copy the one you want to {{ yubikey_ssh_key }}, with its .pub file.
              when: yubikey_found.files | length > 1

            - name: Create the SSH directory
              ansible.builtin.file:
                path: "{{ yubikey_ssh_key | dirname }}"
                state: directory
                mode: "0700"

            - name: Install the key file
              ansible.builtin.copy:
                src: "{{ yubikey_found.files[0].path }}"
                dest: "{{ yubikey_ssh_key }}"
                remote_src: true
                mode: "0600"

            - name: Install the public key
              ansible.builtin.copy:
                src: "{{ yubikey_found.files[0].path }}.pub"
                dest: "{{ yubikey_ssh_key }}.pub"
                remote_src: true
                mode: "0644"

            - name: Read the key's fingerprint
              ansible.builtin.command:
                argv: [ssh-keygen, -l, -f, "{{ yubikey_ssh_key }}.pub"]
              register: yubikey_fingerprint
              changed_when: false

            - name: Show the restored key
              ansible.builtin.debug:
                msg: "Restored {{ yubikey_ssh_key }} ({{ yubikey_fingerprint.stdout }}). Logging in needs a touch of the YubiKey."

          rescue:
            - name: Report why the key wasn't restored
              ansible.builtin.debug:
                msg: >-
                  The SSH key wasn't restored: {{ ansible_failed_result.msg | default('unknown error') }}
                  The rest of the setup is unaffected.

          always:
            - name: Remove the working directory
              ansible.builtin.file:
                path: "{{ yubikey_tmp.path }}"
                state: absent
              when: yubikey_tmp.path is defined

        - name: Note that the download was skipped
          ansible.builtin.debug:
            msg: "Skipped. Run ./apply.sh --tags ssh-key to download {{ yubikey_ssh_key }} from the YubiKey later."
          when:
            - not yubikey_key_file.stat.exists
            - yubikey_pin.user_input | default('') | length == 0
