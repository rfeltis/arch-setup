---
- name: Set up Arch
  hosts: all
  gather_facts: true

  vars:
    fish_dir: "{{ lookup('env', 'HOME') }}/.config/fish"
    fish_links:
      - config.fish
      - functions/fish_greeting.fish
    packages:
      # KDE
      - plasma-meta
      - plasma-login-manager
      - konsole
      - ghostty
      - dolphin
      # shell + cli
      - fish
      - eza
      - fzf
      - btop
      - zoxide
      - fastfetch
      - pciutils
      - micro
      - ncdu
      - nano
      - less
      - vim
      - mpv
      - opencode
      # apps
      - handbrake
      - gimp
      - krita
      - steam
      - gamescope
      - dolphin-emu
      - mumble
      - feishin
      - signal-desktop
      # build deps for AUR packages
      - base-devel
      - git
      - dkms
      - linux-headers

    surface_packages:
      - linux-surface
      - linux-surface-headers
      - iptsd

    nvidia_packages:
      - nvidia-open-dkms
      - nvidia-utils
      - lib32-nvidia-utils
      - nvidia-settings

    aur_packages:
      - brave-bin
      - visual-studio-code-bin
      - discord
      - github-copilot-cli
      - github-copilot-app-bin
      - herdr-bin
      - r2modman-bin
      - bazecor
      - ventoy-bin
      - xpad-noone-git
      - opencode-desktop-bin
      - antigravity
      - zoom
      - kopia-ui-bin
      - lichii-bin

    sunshine_aur_packages:
      - sunshine

    stryketopia_packages:
      - sshfs
      - gocryptfs

    stryketopia_aur_packages:
      - cnrdrvcups-lb-bin

    # Mounted on first access, so boot doesn't wait for the server
    torrents_mount_src: "stryke@192.168.1.2:/mnt/data/torrents"
    torrents_mount_path: "{{ lookup('env', 'HOME') }}/torrents"
    torrents_mount_opts:
      - x-systemd.automount
      - x-systemd.mount-timeout=15s
      - _netdev
      - nofail
      - reconnect
      - ConnectTimeout=5
      - ServerAliveInterval=15
      - ServerAliveCountMax=3
      # root does the mount, so point it at the user's key and known hosts
      - "IdentityFile={{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
      - "UserKnownHostsFile={{ lookup('env', 'HOME') }}/.ssh/known_hosts"
      - allow_other
      - "uid={{ ansible_user_uid }}"
      - "gid={{ ansible_user_gid }}"

  tasks:
    - name: Detect Surface hardware
      ansible.builtin.set_fact:
        is_surface: "{{ 'Surface' in ansible_product_name | default('') }}"

    - name: Set up the linux-surface repository
      when: is_surface
      block:
        - name: Import the linux-surface signing key
          become: true
          ansible.builtin.shell:
            cmd: >-
              curl -fsSL https://raw.githubusercontent.com/linux-surface/linux-surface/master/pkg/keys/surface.asc
              | pacman-key --add - && pacman-key --lsign-key 56C464BAAC421453
          changed_when: false

        - name: Remove any unmanaged linux-surface repository entry
          become: true
          ansible.builtin.replace:
            path: /etc/pacman.conf
            regexp: '(?<!# BEGIN ANSIBLE linux-surface\n)^\[linux-surface\]\n(?:(?:SigLevel|Server|Include)[^\n]*\n)*'
            replace: ''

        - name: Add the linux-surface repository
          become: true
          ansible.builtin.blockinfile:
            path: /etc/pacman.conf
            marker: "# {mark} ANSIBLE linux-surface"
            block: |
              [linux-surface]
              Server = https://pkg.surfacelinux.com/arch/
          register: surface_repo

    - name: Enable the multilib repository
      become: true
      ansible.builtin.replace:
        path: /etc/pacman.conf
        regexp: '^#\[multilib\]\n#Include = (.*)$'
        replace: '[multilib]\nInclude = \1'
      register: multilib

    - name: Refresh the package databases
      become: true
      ansible.builtin.command: pacman -Sy
      when: multilib.changed or surface_repo.changed | default(false)
      changed_when: false

    - name: Install packages
      become: true
      ansible.builtin.package:
        name: "{{ packages }}"
        state: present

    - name: Install stryketopia packages
      become: true
      ansible.builtin.package:
        name: "{{ stryketopia_packages }}"
        state: present
      when: ansible_hostname == 'stryketopia'

    - name: Mount the torrents share over SSHFS
      when: ansible_hostname == 'stryketopia'
      block:
        - name: Create the torrents mount point
          ansible.builtin.file:
            path: "{{ torrents_mount_path }}"
            state: directory
            mode: "0755"

        - name: Add the torrents share to fstab
          become: true
          ansible.posix.mount:
            src: "{{ torrents_mount_src }}"
            path: "{{ torrents_mount_path }}"
            fstype: fuse.sshfs
            opts: "{{ torrents_mount_opts | join(',') }}"
            state: present
          register: torrents_fstab

        - name: Start the torrents automount
          become: true
          ansible.builtin.systemd_service:
            name: remote-fs.target
            state: started
            daemon_reload: true
          when: torrents_fstab.changed

    - name: Install the Surface kernel
      become: true
      ansible.builtin.package:
        name: "{{ surface_packages }}"
        state: present
      when: is_surface

    - name: Detect PCI devices
      ansible.builtin.command: lspci -Dn
      register: pci_devices
      changed_when: false
      check_mode: false

    - name: Detect NVIDIA graphics hardware
      ansible.builtin.set_fact:
        has_nvidia_gpu: >-
          {{ pci_devices.stdout is search('(?im)^\S+\s+03[0-9a-f]{2}:\s+10de:') }}

    - name: Install NVIDIA open kernel modules and utilities
      become: true
      ansible.builtin.package:
        name: "{{ nvidia_packages }}"
        state: present
      when: has_nvidia_gpu

    - name: Check the current display manager
      ansible.builtin.stat:
        path: /etc/systemd/system/display-manager.service
      register: dm

    - name: Disable SDDM
      become: true
      ansible.builtin.systemd_service:
        name: sddm
        enabled: false
      when: "'sddm' in dm.stat.lnk_target | default('')"

    - name: Make plasma-login-manager the display manager
      become: true
      ansible.builtin.command: systemctl enable --force plasmalogin.service
      when: "'plasmalogin' not in dm.stat.lnk_target | default('')"
      changed_when: true

    - name: Install the Gamescope session launcher
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/gamescope/gamescope-session"
        dest: /usr/local/bin/gamescope-session
        mode: "0755"

    - name: Add Gamescope to the login manager sessions
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/gamescope/steam-gamescope.desktop"
        dest: /usr/share/wayland-sessions/steam-gamescope.desktop
        mode: "0644"

    - name: Install the Stryke root CA certificate
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/strykeca.crt"
        dest: /etc/ca-certificates/trust-source/anchors/strykeca.crt
        mode: "0644"
      register: strykeca_cert

    - name: Update the system CA trust store
      become: true
      ansible.builtin.command: update-ca-trust
      when: strykeca_cert.changed
      changed_when: true

    - name: Set fish as the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id | default(lookup('env', 'USER')) }}"
        shell: /usr/bin/fish

    - name: Create the fish config directories
      ansible.builtin.file:
        path: "{{ fish_dir }}/{{ item | dirname }}"
        state: directory
        mode: "0755"
      loop: "{{ fish_links }}"

    - name: Link the fish config from the repo
      ansible.builtin.file:
        src: "{{ playbook_dir }}/fish/{{ item }}"
        dest: "{{ fish_dir }}/{{ item }}"
        state: link
        force: true
      loop: "{{ fish_links }}"

    - name: Check for paru
      ansible.builtin.stat:
        path: /usr/bin/paru
      register: paru

    - name: Install paru-bin
      when: not paru.stat.exists
      block:
        - name: Clone paru-bin
          ansible.builtin.git:
            repo: https://aur.archlinux.org/paru-bin.git
            dest: /tmp/paru-bin
            depth: 1
            version: master

        - name: Package paru-bin
          ansible.builtin.command:
            cmd: makepkg -sf --noconfirm
            chdir: /tmp/paru-bin
          changed_when: true

        - name: Find the built package
          ansible.builtin.find:
            paths: /tmp/paru-bin
            patterns: "paru-bin-*.pkg.tar.*"
            excludes: "paru-bin-debug-*"
          register: pkg

        - name: Install paru-bin
          become: true
          ansible.builtin.command:
            cmd: pacman -U --noconfirm --needed {{ pkg.files | map(attribute='path') | join(' ') }}
          changed_when: true

      always:
        - name: Remove the paru-bin build directory
          ansible.builtin.file:
            path: /tmp/paru-bin
            state: absent

    - name: List installed packages
      ansible.builtin.command: pacman -Qq
      register: installed
      changed_when: false
      check_mode: false

    - name: Install AUR packages
      vars:
        selected_aur_packages: >-
          {{ aur_packages
             + (sunshine_aur_packages if ansible_hostname == 'livingroom' else [])
             + (stryketopia_aur_packages if ansible_hostname == 'stryketopia' else []) }}
        missing: "{{ selected_aur_packages | difference(installed.stdout_lines) }}"
      when: missing | length > 0
      block:
        - name: Allow paru to run pacman without a password prompt
          become: true
          ansible.builtin.copy:
            dest: /etc/sudoers.d/99-paru
            mode: "0440"
            validate: visudo -cf %s
            content: "{{ lookup('env', 'USER') }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
          changed_when: false

        - name: Install with paru
          ansible.builtin.command:
            cmd: paru -S --noconfirm --needed --skipreview {{ item }}
          loop: "{{ missing }}"
          changed_when: true

      always:
        - name: Drop the passwordless sudo rule
          become: true
          ansible.builtin.file:
            path: /etc/sudoers.d/99-paru
            state: absent
          changed_when: false
